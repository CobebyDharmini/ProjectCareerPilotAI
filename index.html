<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="CareerPilot AI — your career preparation and internship application workspace." />
    <title>CareerPilot AI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #f5f7ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem clamp(1rem, 4vw, 3rem); border-bottom: 1px solid #ffffff18; background: #0b1020; }
      .brand { display: flex; align-items: center; gap: .75rem; font-weight: 700; letter-spacing: .01em; }
      .mark { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: .8rem; background: linear-gradient(135deg, #8068ff, #38c7b8); color: white; }
      .open { display: inline-flex; align-items: center; justify-content: center; min-height: 2.6rem; padding: .6rem 1rem; border-radius: .7rem; color: #fff; background: #6d5dfc; text-decoration: none; font-weight: 650; }
      .open:hover { background: #8275ff; }
      main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 1rem clamp(.5rem, 2vw, 1.5rem); }
      .intro { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding: .2rem .5rem .85rem; color: #aab3ce; font-size: .9rem; }
      .intro strong { color: #f5f7ff; font-size: 1rem; }
      iframe { flex: 1; width: 100%; min-height: 75vh; border: 1px solid #ffffff20; border-radius: .85rem; background: #10182b; }
      footer { padding: .8rem 1rem 1.2rem; color: #96a0bc; text-align: center; font-size: .8rem; }
      footer a { color: #c0baff; }
      @media (max-width: 600px) { header { align-items: flex-start; } .intro { align-items: flex-start; flex-direction: column; } iframe { min-height: 78vh; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>CareerPilot AI</span></div>
      <a class="open" href="https://projectcareerpilotai-n3umlerfzrwpstl4p5wudi.streamlit.app/" target="_blank" rel="noopener noreferrer">Open app ↗</a>
    </header>
    <main>
      <div class="intro"><strong>Your career workspace</strong><span>Resume insights · opportunities · application tracking · interview practice</span></div>
      <iframe title="CareerPilot AI application" src="https://projectcareerpilotai-n3umlerfzrwpstl4p5wudi.streamlit.app/?embed=true" allow="clipboard-read; clipboard-write" loading="eager"></iframe>
    </main>
    <footer>If the app does not load here, <a href="https://projectcareerpilotai-n3umlerfzrwpstl4p5wudi.streamlit.app/" target="_blank" rel="noopener noreferrer">open CareerPilot AI directly</a>.</footer>
  </body>
</html>
